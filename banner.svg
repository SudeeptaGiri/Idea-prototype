<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff" />
      <stop offset="100%" stop-color="#e0eaff" />
    </linearGradient>
    
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a89ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2a6be0" stop-opacity="0.1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <clipPath id="screen-clip">
      <rect x="250" y="150" width="300" height="200" rx="10" ry="10" />
    </clipPath>
  </defs>

  <!-- Main background -->
  <rect width="800" height="600" fill="url(#bg-gradient)" />
  
  <!-- Decorative circuit paths -->
  <g stroke="#2a6be0" stroke-width="1.5" fill="none" opacity="0.2">
    <path d="M50,300 C100,250 150,350 200,300 C250,250 300,350 350,300" />
    <path d="M450,300 C500,250 550,350 600,300 C650,250 700,350 750,300" />
    <path d="M50,350 C150,300 250,400 350,350 C450,300 550,400 750,350" />
    <path d="M50,250 C150,200 250,300 350,250 C450,200 550,300 750,250" />
    
    <!-- Data points -->
    <circle cx="50" cy="300" r="3" fill="#2a6be0" />
    <circle cx="200" cy="300" r="3" fill="#2a6be0" />
    <circle cx="350" cy="300" r="3" fill="#2a6be0" />
    <circle cx="450" cy="300" r="3" fill="#2a6be0" />
    <circle cx="600" cy="300" r="3" fill="#2a6be0" />
    <circle cx="750" cy="300" r="3" fill="#2a6be0" />
    
    <circle cx="50" cy="350" r="3" fill="#2a6be0" />
    <circle cx="350" cy="350" r="3" fill="#2a6be0" />
    <circle cx="750" cy="350" r="3" fill="#2a6be0" />
    
    <circle cx="50" cy="250" r="3" fill="#2a6be0" />
    <circle cx="350" cy="250" r="3" fill="#2a6be0" />
    <circle cx="750" cy="250" r="3" fill="#2a6be0" />
  </g>
  
  <!-- Computer/Monitor -->
  <rect x="245" y="145" width="310" height="210" rx="15" ry="15" fill="#2d3748" />
  <rect x="250" y="150" width="300" height="200" rx="10" ry="10" fill="#f5f7fa" />
  
  <!-- Monitor stand -->
  <rect x="370" y="355" width="60" height="15" rx="5" ry="5" fill="#2d3748" />
  <rect x="390" y="325" width="20" height="40" rx="2" ry="2" fill="#2d3748" />
  <ellipse cx="400" cy="370" rx="50" ry="10" fill="#2d3748" opacity="0.7" />
  
  <!-- Screen content -->
  <g clip-path="url(#screen-clip)">
    <!-- Digital face/AI representation -->
    <circle cx="400" cy="220" r="60" fill="#19c6a3" opacity="0.1" />
    <circle cx="400" cy="220" r="50" fill="#19c6a3" opacity="0.2" />
    
    <!-- AI face representation -->
    <g fill="none" stroke="#2A6BE0" stroke-width="2" stroke-linecap="round">
      <!-- Abstract facial features -->
      <circle cx="400" cy="220" r="40" />
      
      <!-- Eyes -->
      <ellipse cx="380" cy="210" rx="8" ry="7" fill="#2A6BE0" stroke="none" />
      <ellipse cx="420" cy="210" rx="8" ry="7" fill="#2A6BE0" stroke="none" />
      
      <!-- Light reflection in eyes -->
      <circle cx="383" cy="208" r="2" fill="white" stroke="none" />
      <circle cx="423" cy="208" r="2" fill="white" stroke="none" />
      
      <!-- Abstract mouth/smile -->
      <path d="M380,235 Q400,250 420,235" stroke-width="3" />
      
      <!-- Digital particles/elements -->
      <g fill="#2A6BE0" stroke="none">
        <circle cx="370" cy="190" r="2" />
        <circle cx="430" cy="190" r="2" />
        <circle cx="360" cy="230" r="2" />
        <circle cx="440" cy="230" r="2" />
        <circle cx="400" cy="180" r="2" />
      </g>
    </g>
    
    <!-- Data visualization/analysis elements -->
    <g stroke="#2A6BE0" stroke-width="1.5" fill="none">
      <!-- Graph left side -->
      <polyline points="270,310 290,290 310,300 330,280 350,290" />
      <!-- Graph right side -->
      <polyline points="450,290 470,280 490,300 510,290 530,310" />
    </g>
    
    <!-- Text elements/Lines -->
    <g fill="#8A94A6">
      <rect x="270" y="260" width="80" height="5" rx="2" ry="2" />
      <rect x="270" y="270" width="60" height="5" rx="2" ry="2" />
      
      <rect x="450" y="260" width="80" height="5" rx="2" ry="2" />
      <rect x="450" y="270" width="60" height="5" rx="2" ry="2" />
      
      <rect x="300" y="330" width="200" height="5" rx="2" ry="2" />
      <rect x="340" y="340" width="120" height="5" rx="2" ry="2" />
    </g>
  </g>
  
  <!-- Person silhouette -->
  <g transform="translate(400, 450)">
    <!-- Head -->
    <circle cx="0" cy="-50" r="25" fill="#2d3748" />
    
    <!-- Body -->
    <path d="M0,-25 L0,20 M-30,0 L30,0" stroke="#2d3748" stroke-width="8" stroke-linecap="round" />
    
    <!-- Connection beams between AI and person -->
    <g opacity="0.7">
      <path d="M-15,-60 L-30,-110 Q-40,-150 -60,-160" stroke="#FF9E44" stroke-width="2" stroke-dasharray="3,3" />
      <path d="M15,-60 L30,-110 Q40,-150 60,-160" stroke="#FF9E44" stroke-width="2" stroke-dasharray="3,3" />
      <path d="M0,-75 L0,-100 Q0,-150 0,-165" stroke="#2A6BE0" stroke-width="3" stroke-dasharray="5,5">
        <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
  
  <!-- Glow effect around computer -->
  <rect x="245" y="145" width="310" height="210" rx="15" ry="15" fill="url(#glow-gradient)" filter="url(#glow)" opacity="0.5" />
  
  <!-- Floating elements -->
  <g fill="#2A6BE0" opacity="0.8">
    <circle cx="150" cy="150" r="10">
      <animate attributeName="cy" values="150;140;150" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="180" r="8">
      <animate attributeName="cy" values="180;170;180" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="480" r="12" opacity="0.5">
      <animate attributeName="cy" values="480;470;480" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="450" r="15" opacity="0.3">
      <animate attributeName="cy" values="450;440;450" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Tech icons floating -->
  <g fill="#19C6A3" opacity="0.8">
    <!-- Code symbol -->
    <g transform="translate(130, 390)">
      <text font-family="monospace" font-size="18" text-anchor="middle">&lt;/&gt;</text>
      <animate attributeName="transform" from="translate(130, 390)" to="translate(130, 380)" dur="3s" repeatCount="indefinite" />
    </g>
    
    <!-- Database symbol -->
    <g transform="translate(680, 360)">
      <rect x="-10" y="-7" width="20" height="14" rx="3" ry="3" />
      <ellipse cx="0" cy="-7" rx="10" ry="3" />
      <ellipse cx="0" cy="7" rx="10" ry="3" />
      <animate attributeName="transform" from="translate(680, 360)" to="translate(680, 350)" dur="4s" repeatCount="indefinite" />
    </g>
  </g>
  
  <!-- Title -->
  <text x="400" y="520" font-family="Poppins, sans-serif" font-size="24" font-weight="600" fill="#2d3748" text-anchor="middle">AI INTERVIEW PLATFORM</text>
 
</svg>